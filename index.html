<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRbet - Pro Sports & Casino</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; padding-bottom: 70px; }

        /* টপ হেডার */
        header {
            background-color: #1a232e;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { color: #fff; font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .auth-btns a { text-decoration: none; font-size: 14px; font-weight: bold; padding: 8px 12px; border-radius: 4px; margin-left: 5px; }
        .login { color: #fff; border: 1px solid #444; }
        .reg { background-color: #e91e63; color: white; }

        /* প্রমোশন স্লাইডার সিমুলেশন */
        .promo-slider {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            background: white;
        }
        .promo-card {
            min-width: 140px;
            height: 180px;
            background: #eee;
            border-radius: 8px;
            background-size: cover;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        /* গেম ক্যাটাগরি আইকন */
        .game-icons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 15px;
            gap: 10px;
            background: white;
            margin-top: 5px;
        }
        .icon-item { text-align: center; font-size: 11px; font-weight: bold; }
        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff5722, #f44336);
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* লাইভ স্পোর্টস কার্ড */
        .live-section { padding: 15px; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .sport-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .match-info { font-size: 13px; color: #666; margin-bottom: 8px; }
        .match-teams { font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }

        /* বটম নেভিগেশন */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            z-index: 1000;
        }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 12px; }
        .nav-item.active { color: #007bff; }
        .bet-slip {
            width: 50px;
            height: 50px;
            background: #007bff;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -25px;
            border: 5px solid #f4f6f8;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">XRbet 🚩</div>
        <div class="auth-btns">
            <a href="#" class="login">Log in</a>
            <a href="#" class="reg">Registration</a>
        </div>
    </header>

    <div class="promo-slider">
        <div class="promo-card" style="background-image: url('https://img.freepik.com/free-vector/casino-bonuses-banners-set_23-2148818401.jpg');">BONUS FOR SPORTS</div>
        <div class="promo-card" style="background-image: url('https://img.freepik.com/free-photo/vibrant-night-city-with-neon-lights_23-2151654157.jpg');">UEFA BOOST</div>
        <div class="promo-card" style="background-image: url('https://img.freepik.com/free-vector/gradient-casino-background_23-2148924147.jpg');">FREEBET HOUR</div>
    </div>

    <div class="game-icons">
        <div class="icon-item"><div class="icon-circle">🎰</div>Crash</div>
        <div class="icon-item"><div class="icon-circle">💎</div>Crystal</div>
        <div class="icon-item"><div class="icon-circle">🃏</div>21</div>
        <div class="icon-item"><div class="icon-circle">🎡</div>Las Vegas</div>
        <div class="icon-item"><div class="icon-circle">⚡</div>More</div>
    </div>

    <div class="live-section">
        <div class="section-title">LIVE (757) <span style="color:#007bff; font-size:12px;">MORE LIVE ></span></div>
        
        <div class="sport-card">
            <div class="match-info">⚽ Football - UEFA Champions League</div>
            <div class="match-teams">
                <span>Real Madrid</span>
                <span>2</span>
            </div>
            <div class="match-teams">
                <span>Man City</span>
                <span>1</span>
            </div>
        </div>

        <div class="sport-card">
            <div class="match-info">🏀 Basketball - NBA</div>
            <div class="match-teams">
                <span>Lakers</span>
                <span>102</span>
            </div>
            <div class="match-teams">
                <span>Warriors</span>
                <span>98</span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item">🏆<br>Sports</a>
        <a href="#" class="nav-item">🎰<br>Casino</a>
        <a href="#" class="nav-item"><div class="bet-slip">📝</div>Bet Slip</a>
        <a href="#" class="nav-item">👤<br>Log in</a>
        <a href="#" class="nav-item">☰<br>Menu</a>
    </nav>

</body>
</html>
