<script>
// ১. লগইন এবং মেনু কন্ট্রোল
const loginModal = document.getElementById("loginModal");
function openLogin(){ loginModal.classList.add("active"); }
function closeLogin(){ loginModal.classList.remove("active"); }
function loginSuccess(){ alert("Login Successful!"); closeLogin(); }

// ২. ক্রিকেট লাইভ স্কোর এপিআই কনফিগারেশন
const options = {
    method: 'GET',
    headers: {
        'x-rapidapi-key': 'c764d24e32msha6856111d67d95bp1ae7dcjsn19795bb60fda',
        'x-rapidapi-host': 'cricbuzz-cricket.p.rapidapi.com'
    }
};

// ৩. লাইভ স্কোর লোড করার আসল ফাংশন
async function loadLiveScore() {
    try {
        const response = await fetch('https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live', options);
        const data = await response.json();
        
        // সঠিক ডাটা ফিল্টার (ছবি ৫৪২১০ অনুযায়ী সংশোধিত)
        const match = data?.typeMatches?.[0]?.seriesMatches?.[0]?.seriesAdWrapper?.matches?.[0];

        if (match) {
            const t1 = document.getElementById("team1");
            const t2 = document.getElementById("team2");
            const scoreVal = document.getElementById("score-val");

            if(t1) t1.innerText = match.matchInfo.team1.teamName;
            if(t2) t2.innerText = match.matchInfo.team2.teamName;
            if(scoreVal) scoreVal.innerText = match.matchScore?.team1Score?.inngs1?.runs || "Live Now";
        }
    } catch (error) {
        console.error("Score load failed:", error);
    }
}

// ৪. অটো রান
loadLiveScore();
setInterval(loadLiveScore, 60000); // প্রতি ১ মিনিট পর আপডেট হবে
</script>
